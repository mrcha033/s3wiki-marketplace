name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate unified package
        run: python3 tests/test_marketplace_packaging.py
      - name: Test lab-meeting slide skill
        run: python3 -m unittest discover -s skills/build-lab-meeting-slides/tests -v
      - name: Check installers
        run: |
          bash -n scripts/install.sh
          bash -n tests/test_clean_install.sh
          pwsh -NoProfile -Command \
            '[scriptblock]::Create((Get-Content scripts/install.ps1 -Raw)) | Out-Null'
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install supported clients
        run: >-
          npm install --global
          @openai/codex@0.145.0
          @anthropic-ai/claude-code@2.1.220
      - name: Test clean Codex and Claude install
        run: bash tests/test_clean_install.sh
